<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<title>Studio — QuBiTAi</title>
<link rel="icon" href="./assets/AudioWide-White.ico">
<style>
:root {
  --page: #f5f5f7;
  --ink: #1d1d1f;
  --muted: #6e6e73;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background: var(--page);
  -webkit-font-smoothing: antialiased;
}
.site-nav {
  position: fixed;
  inset: 0 0 auto;
  z-index: 10;
  height: 52px;
  background: rgba(22,22,23,.88);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.nav-inner {
  width: min(100% - 48px, 1140px);
  height: 100%;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  color: #fff;
  text-decoration: none;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.035em;
}
.nav-links { display: flex; gap: 32px; }
.nav-links a {
  color: rgba(255,255,255,.82);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: color .18s ease;
}
.nav-links a:hover { color: #fff; }
.menu-toggle {
  display: none;
  padding: 8px;
  border: 0;
  color: #fff;
  background: transparent;
  font: inherit;
  font-size: 21px;
  cursor: pointer;
}
.mobile-menu {
  display: none;
  position: fixed;
  inset: 52px 0 0;
  z-index: 9;
  padding: 48px 24px;
  background: rgba(22,22,23,.98);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
}
.mobile-menu.open { display: flex; }
.mobile-menu a {
  color: #fff;
  text-decoration: none;
  font-size: 27px;
  letter-spacing: -.035em;
}
.studio-hero {
  min-height: 100svh;
  padding: 100px 24px 64px;
  display: grid;
  place-items: center;
  text-align: center;
  background:
    radial-gradient(ellipse 44% 35% at 50% 48%,
      rgba(255,255,255,.92), transparent),
    var(--page);
}
.studio-message {
  width: min(100%, 980px);
  margin: auto;
  transform: translateY(-8px);
  animation: arrive .9s cubic-bezier(.2,.75,.25,1) both;
}
.eyebrow {
  margin: 0 0 22px;
  color: var(--muted);
  font-size: clamp(14px, 1.7vw, 18px);
  font-weight: 500;
  letter-spacing: -.015em;
}
.studio-title {
  margin: 0;
  color: var(--ink);
  font-size: clamp(64px, 11vw, 116px);
  line-height: .98;
  font-weight: 650;
  letter-spacing: -.075em;
}
.studio-line {
  width: 34px;
  height: 1px;
  margin: 34px auto 25px;
  background: #c7c7cc;
}
.coming-soon {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .11em;
  text-transform: uppercase;
}
@keyframes arrive {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(-8px); }
}
@media (max-width: 720px) {
  .nav-inner { width: calc(100% - 36px); }
  .nav-links { display: none; }
  .menu-toggle { display: block; }
  .studio-hero { padding-inline: 22px; }
  .eyebrow { margin-bottom: 18px; }
  .studio-line { margin-top: 27px; margin-bottom: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<header class="site-nav">
  <nav class="nav-inner" aria-label="Main navigation">
    <a class="brand" href="./index.html">QuBiTAi</a>
    <div class="nav-links">
      <a href="./projects.html">WORKS</a>
      <a href="./write.html">WRITE</a>
      <a href="./scribe/research.html">RESEARCH</a>
    </div>
    <button class="menu-toggle" id="menuToggle" type="button"
      aria-label="Open navigation" aria-expanded="false"
      aria-controls="mobileMenu">☰</button>
  </nav>
</header>
<nav class="mobile-menu" id="mobileMenu" aria-label="Mobile navigation">
  <a href="./projects.html">Works</a>
  <a href="./write.html">Write</a>
  <a href="./scribe/research.html">Research</a>
</nav>
<main>
  <section class="studio-hero" aria-labelledby="studioTitle">
    <div class="studio-message">
      <!-- <p class="eyebrow">Creative</p> -->
      <h1 class="studio-title" id="studioTitle">Studio.</h1>
      <div class="studio-line" aria-hidden="true"></div>
      <p class="coming-soon">Coming soon</p>
    </div>
  </section>
</main>
<script>
const menuToggle = document.getElementById("menuToggle");
const mobileMenu = document.getElementById("mobileMenu");

function closeMenu() {
  mobileMenu.classList.remove("open");
  menuToggle.setAttribute("aria-expanded", "false");
  menuToggle.setAttribute("aria-label", "Open navigation");
}
menuToggle.addEventListener("click", () => {
  const open = mobileMenu.classList.toggle("open");
  menuToggle.setAttribute("aria-expanded", String(open));
  menuToggle.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
});
mobileMenu.querySelectorAll("a").forEach(link => link.addEventListener("click", closeMenu));
document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeMenu();
});
</script>
</body>
</html>
