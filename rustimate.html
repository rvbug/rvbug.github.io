<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Rustimate is archived and no longer in active development.">
    <title>Rustimate | Archived</title>
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/AudioWide-White.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000000;
            --text-main: #ffffff;
            --text-dim: #86868b;
            --accent: #ff4d00;
            --glass-border: rgba(255, 255, 255, 0);
            --card-bg: #0d0d0f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 40px;
        }

        nav {
            position: relative;
            z-index: 1;
            width: 100%;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.7);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            backdrop-filter: saturate(180%) blur(20px);
        }

        .nav-content {
            min-height: 70px;
            display: flex;
            align-items: center;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-qubit {
            color: var(--accent);
            font-weight: 600;
        }

        .brand-rustimate {
            color: var(--text-main);
            font-weight: 600;
        }

        .divider {
            width: 1px;
            height: 16px;
            background: rgba(255, 255, 255, 0.2);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 0;
        }

        .archive-card {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 64px 48px;
            border: none;
            border-radius: 0;
            background: none;
            text-align: center;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 7px 13px;
            margin-bottom: 30px;
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            background: rgba(255,255,255,0.03);
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-mark {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
        }

        h1 {
            margin-bottom: 24px;
            font-size: clamp(38px, 7vw, 64px);
            font-weight: 600;
            letter-spacing: -0.055em;
            line-height: 1.05;
        }

        h1 span {
            color: var(--accent);
        }

        .message {
            max-width: 560px;
            margin: 0 auto;
            color: var(--text-dim);
            font-size: 18px;
            font-weight: 300;
            line-height: 1.8;
        }

        footer {
            border-top: 1px solid var(--glass-border);
            padding: 24px 0;
        }

        .footer-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .footer-brand {
            color: var(--text-dim);
            font-size: 13px;
        }

        .footer-brand span {
            color: var(--accent);
            font-weight: 600;
        }

        .copyright {
            color: var(--text-dim);
            font-size: 12px;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .container {
                padding: 0 22px;
            }

            .nav-content {
                min-height: 64px;
            }

            main {
                padding: 64px 0;
            }

            .archive-card {
                padding: 48px 24px;
                border-radius: 0;
            }

            .message {
                font-size: 16px;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <nav aria-label="Site header">
        <div class="container nav-content">
            <div class="nav-left">
                <a href="https://qubitai.in" class="brand-qubit">QuBiTAi</a>
                <span class="divider" aria-hidden="true"></span>
                <span class="brand-rustimate" aria-current="page">Rustimate</span>
            </div>
        </div>
    </nav>

    <main>
        <div class="container">
            <section class="archive-card" aria-labelledby="archive-title">
                <div class="status">
                    <span class="status-mark" aria-hidden="true"></span>
                    Project archived
                </div>
                <h1 id="archive-title">Rustimate is <span>archived.</span></h1>
                <p class="message">
                    This project is archived and no longer in active development.
                </p>
            </section>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <p class="footer-brand"><span>QuBiTAi</span> · Independent Systems &amp; Research</p>
            <p class="copyright">© <span id="year">2026</span> QuBiTAi</p>
        </div>
    </footer>
</body>
</html>
