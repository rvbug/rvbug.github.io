project:
  type: book
  output-dir: ../book/

book:
  title: "The Book"
  author: "Rakesh V"
  date: "11/30/2025"
  favicon: images/AudioWide-White.ico
  sidebar: 
    style: "docked"  # or "floating"
    location: left
    background: light
  sharing: [twitter, linkedin]

  chapters:
    - index.qmd

    - part: doc2quarto/index.qmd
      chapters:
        - doc2quarto/usage.qmd
        - doc2quarto/logic.qmd

    - part: FERMI
      chapters:
        - fermi/index.qmd


    - part: Neovim
      chapters:
        - neovim/index.qmd
        - neovim/config.qmd
        - neovim/plugins.qmd
    
    - part: Emacs
      chapters:
        - emacs/index.qmd
        - emacs/elisp.qmd
        - emacs/configuration.qmd

format:
  html:
    toc: false
    
    theme:
      - cosmo
      - brand
    css: styles.css
    number-sections: false
editor: visual

